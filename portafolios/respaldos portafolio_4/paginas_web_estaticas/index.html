<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACME Soluciones Digitales</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }
        .card {
            background: #ffffff;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            max-width: 500px;
            width: 100%;
            border-top: 5px solid #0056b3;
        }
        .logo {
            font-size: 2.2rem;
            font-weight: 800;
            color: #0056b3;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }
        h1 {
            font-size: 1.4rem;
            color: #2c3e50;
            margin-bottom: 15px;
        }
        p {
            color: #666;
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 25px;
        }
        .badge {
            display: inline-block;
            background-color: #e3f2fd;
            color: #0d47a1;
            padding: 6px 14px;
            font-size: 0.85rem;
            font-weight: 600;
            border-radius: 20px;
            margin-bottom: 20px;
        }
        .footer {
            margin-top: 20px;
            font-size: 0.8rem;
            color: #888;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">ACME</div>
        <span class="badge">AWS Cloud Hosted</span>
        <h1>Soluciones Digitales</h1>
        <p>Estamos trabajando en la infraestructura de nuestra plataforma global. Muy pronto habilitaremos nuevos servicios en la nube.</p>
    </div>
    <div class="footer">
        &copy; 2026 ACME Soluciones Digitales S.A.
    </div>

</body>
</html>
