<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Página no encontrada | ACME</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }
        .card {
            background: #ffffff;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            max-width: 480px;
            width: 100%;
            border-top: 5px solid #d9534f;
        }
        .error-code {
            font-size: 4rem;
            font-weight: 900;
            color: #d9534f;
            line-height: 1;
            margin-bottom: 10px;
        }
        h1 {
            font-size: 1.3rem;
            color: #2c3e50;
            margin-bottom: 15px;
        }
        p {
            color: #666;
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 25px;
        }
        .btn {
            display: inline-block;
            background-color: #0056b3;
            color: #ffffff;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 600;
            transition: background 0.2s;
        }
        .btn:hover {
            background-color: #003d82;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="error-code">404</div>
        <h1>Recurso no encontrado</h1>
        <p>La ruta o el archivo al que intentas acceder no existe en nuestro servidor de S3.</p>
        <a href="index.html" class="btn">Volver al inicio</a>
    </div>

</body>
</html>
